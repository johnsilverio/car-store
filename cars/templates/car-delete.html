{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Delete {{ object.model }} - Car Store</title>
        <link rel="stylesheet" href="{% static 'style.css' %}" />
        <link rel="stylesheet" href="{% static 'car-delete.css' %}" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        {% include "header.html" %}

        <main class="page-content">
            <a class="back-link" href="{% url 'car_detail' object.pk %}" style="display: inline-flex; align-items: center; gap: 8px; color: var(--gray-11); text-decoration: none; font-size: 14px; margin-bottom: 24px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M5 12l6-6M5 12l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Back to details
            </a>

            <div class="delete-container">
                <div class="delete-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <h1 class="delete-title">Delete Car</h1>

                <p class="delete-description">
                    Are you sure you want to delete the <strong>{{ object.brand }} {{ object.model }}</strong>?
                    <br />
                    This action is permanent and cannot be undone.
                </p>

                <form method="post" action="{% url 'car_delete' object.pk %}" style="width: 100%;">
                    {% csrf_token %}
                    <div class="delete-actions">
                        <a href="{% url 'car_detail' object.pk %}" class="button button-secondary">Cancel</a>

                        <button type="submit" class="button button-danger">Yes, delete it</button>
                    </div>
                </form>
            </div>
        </main>

        {% include "footer.html" %}
    </body>
</html>
