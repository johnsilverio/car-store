<header class="site-header">
    <div class="header-inner">
        <!-- Logo -->
        <a href="/cars" class="logo">
            <svg class="logo-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="3" y="11" width="18" height="7" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="7.5" cy="18" r="1.6" fill="currentColor" />
                <circle cx="16.5" cy="18" r="1.6" fill="currentColor" />
            </svg>
            <span class="logo-text">Car<span class="logo-accent">Store</span></span>
        </a>
        <!-- Nav -->
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="{% url 'cars_list' %}" class="nav-link">Cars</a></li>

                {% if user.is_authenticated %}
                    <li><a href="{% url 'new_car' %}" class="button">New Car</a></li>

                    <li class="user-greeting">
                        <span>{{ user.username }}</span>
                    </li>

                    <li><a href="{% url 'logout' %}" class="nav-link nav-link--danger">Logout</a></li>
                {% else %}
                    <li><a href="{% url 'register' %}" class="nav-link">Register</a></li>
                    <li><a href="{% url 'login' %}" class="button">Login</a></li>
                {% endif %}
            </ul>
        </nav>
    </div>
</header>
